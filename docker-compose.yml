name: disaster-response-system

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/.venv
    networks:
      - disaster-response-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - disaster-response-network
    stdin_open: true
    tty: true

networks:
  disaster-response-network:
    driver: bridge